<!DOCTYPE html>
<html>
<head>
    <title>Terminal</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: "Courier New", monospace;
            text-align: center;
            margin-top: 15%;
        }

        #text {
            font-size: 22px;
            margin-bottom: 20px;
            min-height: 30px;
        }

        input {
            background: black;
            border: 1px solid white;
            color: white;
            padding: 10px;
            font-size: 16px;
            text-align: center;
        }

        button {
            background: transparent;
            border: 1px solid white;
            color: white;
            padding: 8px 15px;
            margin-top: 10px;
            cursor: pointer;
        }

        .glitch {
            animation: glitch 0.2s 3;
        }

        @keyframes glitch {
            0% { transform: translate(2px, -2px); }
            50% { transform: translate(-2px, 2px); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body>

<div id="text"></div>

<input type="password" id="pass" placeholder="••••••">
<br>
<button onclick="check()">ENTER</button>

<script>
let message = ">> Access required: Carrier's Birthday...";
let i = 0;

function typeWriter() {
    if (i < message.length) {
        document.getElementById("text").innerHTML += message.charAt(i);
        i++;
        setTimeout(typeWriter, 40);
    }
}

typeWriter();

function check() {
    let input = document.getElementById("pass");

    if (input.value === "100307") {
        document.body.innerHTML = "<h1>ACCESS GRANTED</h1>";
        setTimeout(() => {
            window.location.href = "page2.html";
        }, 1500);
    } else {
        input.classList.add("glitch");
        setTimeout(() => input.classList.remove("glitch"), 200);
    }
}
</script>

</body>
</html>
